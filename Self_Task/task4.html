<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Array</title>
</head>
<body>
    <script>

        //reverse a string without using reverse method
        let name = "Prashant";
        let result = "";
        for(let i = name.length - 1; i >=0;i--){
            result += name[i];
        }
        document.writeln(result);
    </script>
</body>
</html>
