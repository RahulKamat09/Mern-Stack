<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Reservations - BookNest Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow-lg p-4">
      <h2 class="text-center text-primary mb-4">Book Reservations</h2>
      <div id="reservationContainer"></div>
      <div class="text-center mt-3">
        <a href="index.html" class="btn btn-secondary">Back to Form</a>
      </div>
    </div>
  </div>

  <script>
    let reservations = JSON.parse(localStorage.getItem("reservations")) || [];

    let container = document.getElementById("reservationContainer");

    if(reservations.length === 0){
      container.innerHTML = `<p class="text-center text-muted">No bookings available</p>`;
    } else {
      let table = `
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Book Title</th>
              <th>Author</th>
              <th>Pickup Date</th>
            </tr>
          </thead>
          <tbody>
            ${reservations.map(r => `
              <tr>
                <td>${r.fullName}</td>
                <td>${r.email}</td>
                <td>${r.phone}</td>
                <td>${r.bookTitle}</td>
                <td>${r.authorName}</td>
                <td>${r.pickupDate}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>`;
      container.innerHTML = table;
    }
  </script>
</body>
</html>
