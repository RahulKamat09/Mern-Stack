<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest Library - Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow-lg p-4">
      <h2 class="text-center text-primary mb-4">Book Reservation Form</h2>
      <form id="reservationForm" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" id="fullName" class="form-control" placeholder="Enter full name">
            <div class="text-danger small" id="nameError"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email">
            <div class="text-danger small" id="emailError"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" id="phone" class="form-control" placeholder="10-digit phone" maxlength="10">
            <div class="text-danger small" id="phoneError"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Book Title</label>
            <input type="text" id="bookTitle" class="form-control" placeholder="Enter book title">
            <div class="text-danger small" id="titleError"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Author Name</label>
            <input type="text" id="authorName" class="form-control" placeholder="Enter author name">
            <div class="text-danger small" id="authorError"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Pickup Date</label>
            <input type="date" id="pickupDate" class="form-control">
            <div class="text-danger small" id="dateError"></div>
          </div>
        </div>

        <div class="mt-4 text-center">
          <button type="submit" class="btn btn-success px-4">Submit</button>
          <button type="reset" class="btn btn-secondary px-4">Reset</button>
        </div>
        <div id="successMessage" class="text-success mt-3 text-center fw-bold"></div>
      </form>
      <div class="text-center mt-3">
        <a href="reservation.html" class="btn btn-primary">View Reservations</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("reservationForm").addEventListener("submit", function(e){
      e.preventDefault();

      // Reset error messages
      document.querySelectorAll(".text-danger").forEach(el => el.innerText = "");
      document.getElementById("successMessage").innerText = "";

      let fullName = document.getElementById("fullName").value.trim();
      let email = document.getElementById("email").value.trim();
      let phone = document.getElementById("phone").value.trim();
      let bookTitle = document.getElementById("bookTitle").value.trim();
      let authorName = document.getElementById("authorName").value.trim();
      let pickupDate = document.getElementById("pickupDate").value;

      let valid = true;

      // Validation
      if(fullName === "") { document.getElementById("nameError").innerText = "Name is required"; valid = false; }
      if(email === "" || !/^[^ ]+@[^ ]+\.[a-z]{2,3}$/.test(email)) { 
        document.getElementById("emailError").innerText = "Enter a valid email"; valid = false; 
      }
      if(phone.length !== 10 || isNaN(phone)) { 
        document.getElementById("phoneError").innerText = "Phone must be 10 digits"; valid = false; 
      }
      if(bookTitle === "") { document.getElementById("titleError").innerText = "Book title is required"; valid = false; }
      if(authorName === "") { document.getElementById("authorError").innerText = "Author name is required"; valid = false; }
      if(pickupDate === "") { document.getElementById("dateError").innerText = "Pickup date is required"; valid = false; }

      if(!valid) return;

      // Store in localStorage
      let reservation = { fullName, email, phone, bookTitle, authorName, pickupDate };
      let reservations = JSON.parse(localStorage.getItem("reservations")) || [];
      reservations.push(reservation);
      localStorage.setItem("reservations", JSON.stringify(reservations));

      // Show success
      document.getElementById("successMessage").innerText = "✅ Reservation saved successfully!";
      document.getElementById("reservationForm").reset();
    });
  </script>
</body>
</html>
