<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Shadow-Opacity</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <h2 class="mb-4">Shadows Examples</h2>

    <div class="d-flex gap-4 mb-5">
        <div class="card shadow-sm p-3" style="width:12rem;">
            <p class="mb-0">shadow-sm</p>
        </div>

        <div class="card shadow p-3" style="width:12rem;">
            <p class="mb-0">shadow</p>
        </div>

        <div class="card shadow-lg p-3" style="width:12rem;">
            <p class="mb-0">shadow-lg</p>
        </div>

        <div class="card shadow-none border p-3" style="width:12rem;">
            <p class="mb-0">shadow-none</p>
        </div>
    </div>


    <h2 class="mb-4">Opacity Examples</h2>

    <div class="d-flex gap-4">
        <div class="bg-primary text-white p-3 rounded opacity-25">
            opacity-25
        </div>
        <div class="bg-primary text-white p-3 rounded opacity-50">
            opacity-50
        </div>
        <div class="bg-primary text-white p-3 rounded opacity-75">
            opacity-75
        </div>
        <div class="bg-primary text-white p-3 rounded opacity-100">
            opacity-100
        </div>
    </div>
</body>

</html>
