<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Sizing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <h2 class="text-primary mb-4">🎯 Bootstrap Sizing Examples</h2>

    <!-- Width -->
    <h4>1. Width</h4>
    <div class="bg-primary text-white p-2 w-25 mb-2">w-25</div>
    <div class="bg-success text-white p-2 w-50 mb-2">w-50</div>
    <div class="bg-danger text-white p-2 w-75 mb-2">w-75</div>
    <div class="bg-warning text-dark p-2 w-100 mb-2">w-100</div>
    <div class="bg-info text-white p-2 w-auto mb-2 d-inline-block">w-auto</div>

    <hr>

    <!-- Height -->
    <h4>2. Height</h4>
    <div style="height:200px; background:#eee;" class="d-flex gap-2 p-2">
        <div class="bg-primary text-white h-25 w-25">h-25</div>
        <div class="bg-success text-white h-50 w-25">h-50</div>
        <div class="bg-danger text-white h-75 w-25">h-75</div>
        <div class="bg-warning text-dark h-100 w-25">h-100</div>
    </div>

    <hr>

    <!-- Viewport -->
    <h4>3. Viewport Sizing</h4>
    <div class="vh-100 bg-dark text-white d-flex justify-content-center align-items-center">
        <h3>vh-100 → Full screen height</h3>
    </div>
    <div class="vw-100 bg-success text-white p-3">
        vw-100 → Full screen width
    </div>
</body>

</html>
