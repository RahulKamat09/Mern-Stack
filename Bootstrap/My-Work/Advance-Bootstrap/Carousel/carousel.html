<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel-All-Classes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons (for icons demo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <!-- 🎠 Bootstrap Carousel — Complete Explanation with All Classes & Examples:

        🧩 What is a Carousel?

        A carousel in Bootstrap is a slideshow component that cycles through elements (mostly images or cards) with smooth transitions — either automatically or with user controls.

        It supports:

        Auto-sliding

        Previous/Next navigation

        Slide indicators (dots)

        Captions/text

        Crossfade animation

        Dark/Light variants -->


    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="/images/nature-images..webp" class="d-block w-100" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="/images/Unconfirmed 825766.crdownload" class="d-block w-100" alt="Slide 2">
            </div>
            <div class="carousel-item">
                <img src="/images/nature-image-3.jpg" class="d-block w-100" alt="Slide 3">
            </div>
        </div>

        <!-- Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- 🧱 Class-by-Class Explanation: -->

    <!-- 
    
        | Class                         | Description                                                             |
        | ----------------------------- | ----------------------------------------------------------------------- |
        | `.carousel`                   | Base class for carousel component. Must be added to the main container. |
        | `.slide`                      | Adds a sliding animation between slides.                                |
        | `.carousel-inner`             | Wrapper that contains all the carousel items.                           |
        | `.carousel-item`              | Represents a single slide.                                              |
        | `.active`                     | Makes the first item visible when page loads. Must be used only once.   |
        | `.d-block`                    | Makes the image a block element.                                        |
        | `.w-100`                      | Makes the image take full width of the carousel.                        |
        | `.carousel-control-prev`      | Button class for the “previous” control.                                |
        | `.carousel-control-next`      | Button class for the “next” control.                                    |
        | `.carousel-control-prev-icon` | Built-in Bootstrap icon for previous control.                           |
        | `.carousel-control-next-icon` | Built-in Bootstrap icon for next control.                               |
        | `.carousel-indicators`        | Used to create slide navigation dots.                                   |
        | `.carousel-caption`           | Adds a caption overlay (text and headings) on the slide.                |
        | `.carousel-fade`              | Replaces sliding with a fading transition.                              |
        | `.carousel-dark`              | Changes control icons and captions to dark (for light images).          |-->

    <!-- 🧠 Important Attributes: -->

    <!-- 
    
        | Attribute                          | Description                                                 |
        | ---------------------------------- | ----------------------------------------------------------- |
        | `data-bs-ride="carousel"`          | Enables auto-sliding when the page loads.                   |
        | `data-bs-interval="3000"`          | Sets delay (in ms) between auto slides (3000 = 3 seconds).  |
        | `data-bs-target="#id"`             | Links control or indicator to carousel by ID.               |
        | `data-bs-slide="next"` or `"prev"` | Tells carousel which direction to slide.                    |
        | `data-bs-slide-to="0"`             | Indicates the specific slide to go to (used in indicators). |

    
    -->

</body>

</html>
