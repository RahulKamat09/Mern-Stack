<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel-All-Classes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons (for icons demo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <!-- 🎠 What is a Carousel in Bootstrap?

    A Carousel in Bootstrap is a slideshow component for cycling through elements — like images, text, or custom content — in a rotating, sliding manner.
    It is often used for homepage banners, portfolios, or product showcases. -->

    <!-- ⚙️ Basic Structure (HTML)
    A Bootstrap Carousel is made up of 4 main parts: -->

    <!-- 
    | Part                     | Description                                               |
    | ------------------------ | --------------------------------------------------------- |
    | `<div class="carousel">` | Main wrapper for the carousel.                            |
    | `.carousel-inner`        | Contains all slides (each slide inside `.carousel-item`). |
    | `.carousel-item`         | Each individual slide (image or content).                 |
    | Controls                 | Buttons to go **next** or **previous**.                   |
    | Indicators               | Dots at the bottom to navigate to specific slides.        |
    -->

    <div class="container mt-4">
        <h2 class="text-center mb-4">🌟 Bootstrap 5 Carousel Example</h2>

        <div id="myCarousel" class="carousel slide" data-vs-ride="carousel">

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/id/1018/1000/400" alt="Image-1" class="d-block w-100">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Beautiful Nature</h5>
                        <p>Explore the world through stunning landscapes.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1015/1000/400" class="d-block w-100" alt="Slide 2">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Adventure Awaits</h5>
                        <p>Every moment is a new opportunity.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1019/1000/400" class="d-block w-100" alt="Slide 3">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Urban Vibes</h5>
                        <p>Experience the beauty of city lights.</p>
                    </div>
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>
    </div>

    <!-- 🧱 Explanation of Key Attributes: 

        | Attribute                      | Description                                        |
        | ------------------------------ | -------------------------------------------------- |
        | `data-bs-ride="carousel"`      | Enables automatic sliding.                         |
        | `data-bs-slide-to="0"`         | Moves to specific slide when indicator is clicked. |
        | `data-bs-slide="prev"`         | Moves to the previous slide.                       |
        | `data-bs-slide="next"`         | Moves to the next slide.                           |
        | `class="carousel-item active"` | Marks the first slide as visible by default.       |
     
    -->

</body>

</html>
