<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Accordion All Classes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons (for icons demo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>
    <div class="container mt-3">
        <h1 class="text-center mb-3">Always Open Accordion Example!!</h1>

        <div class="accordion" id="accordionExample2">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#openOne">
                        Item 1
                    </button>
                </h2>
                <div id="openOne" class="accordion-collapse collapse show">
                    <div class="accordion-body">Item 1 Content</div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#openTwo">
                        Item 2
                    </button>
                </h2>
                <div id="openTwo" class="accordion-collapse collapse">
                    <div class="accordion-body">Item 2 Content</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 
        No Explanation because , It is same as the previous one!!!
        Remove data-bs-parent → allows multiple sections open at once.
    -->
</body>

</html>
