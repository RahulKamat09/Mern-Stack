<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - With Icon</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons (for icons demo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>
    <div class="container mt-3">
        <h1 class="text-center mb-3">Accordion With icon Example!!</h1>

        <div class="accordion" id="iconAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#iconOne">
                        <i class="bi bi-info-circle me-2"></i> Accordion with Icon
                    </button>
                </h2>
                <div id="iconOne" class="accordion-collapse collapse show">
                    <div class="accordion-body">This accordion has an icon.</div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
