<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Bootstrap - Grid-System</title>
</head>

<body>
    <div class="container">

        <!-- Auto equal width -->
        <div class="row mb-3">
            <div class="col bg-primary text-white p-3">Auto col</div>
            <div class="col bg-success text-white p-3">Auto col</div>
            <div class="col bg-danger text-white p-3">Auto col</div>
        </div>

        <!-- Fixed width columns -->
        <div class="row mb-3">
            <div class="col-2 bg-primary p-3">col-2</div>
            <div class="col-4 bg-warning p-3">col-4</div>
            <div class="col-6 bg-info p-3">col-6</div>
        </div>

        <!-- Responsive columns -->
        <div class="row mb-3">
            <div class="col-sm-6 col-md-4 col-lg-3 bg-primary text-white p-3">Box 1</div>
            <div class="col-sm-6 col-md-4 col-lg-3 bg-success text-white p-3">Box 2</div>
            <div class="col-sm-6 col-md-4 col-lg-3 bg-danger text-white p-3">Box 3</div>
            <div class="col-sm-6 col-md-4 col-lg-3 bg-warning text-dark p-3">Box 4</div>
        </div>

        <!-- Auto width column -->
        <div class="row mb-3">
            <div class="col-auto bg-dark text-white p-3">Auto Width</div>
            <div class="col bg-secondary text-white p-3">Takes Remaining Space</div>
        </div>

        <!-- Offset example -->
        <div class="row mb-3">
            <div class="col-md-4 offset-md-2 bg-info text-white p-3">col-md-4 + offset-md-2</div>
            <div class="col-md-4 bg-danger text-white p-3">col-md-4</div>
        </div>

    </div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 bg-primary text-white p-3">Column 1</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 bg-success text-white p-3">Column 2</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 bg-danger text-white p-3">Column 3</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 bg-warning text-dark p-3">Column 4</div>
        </div>
    </div>
</body>

</html>
