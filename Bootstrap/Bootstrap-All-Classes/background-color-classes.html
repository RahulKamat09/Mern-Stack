<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Background-Colors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <div class="container">

        <h3 class="mb-3">Bootstrap Backgrounds & Colors</h3>

        <!-- Standard Colors -->
        <p class="bg-primary text-white p-2">bg-primary</p>
        <p class="bg-success text-white p-2">bg-success</p>
        <p class="bg-danger text-white p-2">bg-danger</p>
        <p class="bg-warning text-dark p-2">bg-warning</p>
        <p class="bg-info text-dark p-2">bg-info</p>
        <p class="bg-light text-dark p-2">bg-light</p>
        <p class="bg-dark text-white p-2">bg-dark</p>
        <p class="bg-white text-dark p-2 border">bg-white</p>

        <!-- Gradient -->
        <p class="bg-primary bg-gradient text-white p-2">
            bg-primary bg-gradient → blue gradient
        </p>

        <!-- Special Backgrounds -->
        <p class="bg-body text-dark p-2 border">
            bg-body → matches page body background
        </p>
        <p class="bg-transparent text-dark p-2 border">
            bg-transparent → transparent background (shows parent’s background)
        </p>

    </div>
</body>

</html>
