<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Bootstrap - Gutters(Gaps)</title>
</head>

<body>
    <!-- Default gutter -->
    <h4>Default Gutter</h4>
    <div class="row mb-3">
        <div class="col bg-primary text-white p-3">Col 1</div>
        <div class="col bg-success text-white p-3">Col 2</div>
    </div>

    <!-- g-0 (No gap) -->
    <h4>No Gutter (g-0)</h4>
    <div class="row g-0 mb-3">
        <div class="col bg-danger text-white p-3">Col 1</div>
        <div class="col bg-warning text-dark p-3">Col 2</div>
    </div>

    <!-- g-3 (Both directions) -->
    <h4>Equal Gutter (g-3)</h4>
    <div class="row g-3 mb-3">
        <div class="col bg-info text-white p-3">Col 1</div>
        <div class="col bg-dark text-white p-3">Col 2</div>
        <div class="col bg-success text-white p-3">Col 3</div>
    </div>

    <!-- gx-5 (Horizontal only) -->
    <h4>Horizontal Gutter (gx-5)</h4>
    <div class="row gx-5 mb-3">
        <div class="col bg-primary text-white p-3">Col 1</div>
        <div class="col bg-success text-white p-3">Col 2</div>
    </div>

    <!-- gy-4 (Vertical only) -->
    <h4>Vertical Gutter (gy-4)</h4>
    <div class="row gy-4">
        <div class="col-6 bg-warning text-dark p-3">Row 1 - Col 1</div>
        <div class="col-6 bg-danger text-white p-3">Row 1 - Col 2</div>
        <div class="col-6 bg-info text-white p-3">Row 2 - Col 1</div>
        <div class="col-6 bg-dark text-white p-3">Row 2 - Col 2</div>
    </div>

    </div>
</body>

</html>
