<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Modal Example</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light text-center p-5">


    <!-- 
        🧩 What Is a Modal in Bootstrap?

        A modal is a popup dialog box that appears on top of the current page. It’s often used for:

        Confirmations (like delete confirmation)

        Login/signup forms

        Displaying extra info (like image previews)

        Alerts or notifications
    
    -->

    <!-- Button to Open Modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
        Open Modal
    </button>

    <!-- Modal Structure -->
    <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Modal Title</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    This is the modal content area.
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>

            </div>
        </div>
    </div>

    <!-- 

        🔍 Modal Classes Explained:

        | Class           | Description                                                                                |
        | --------------- | ------------------------------------------------------------------------------------------ |
        | `modal`         | Main modal container. It provides the modal structure.                                     |
        | `fade`          | Adds a fade-in / fade-out animation effect when the modal opens/closes.                    |
        | `modal-dialog`  | Defines the modal’s dialog box (position and width).                                       |
        | `modal-content` | Wraps all modal parts (header, body, footer).                                              |
        | `modal-header`  | Top section — usually contains title and close button.                                     |
        | `modal-title`   | Used for the modal’s title text.                                                           |
        | `modal-body`    | Middle section — main content area.                                                        |
        | `modal-footer`  | Bottom section — usually for buttons like “Close” or “Save”.                               |
        | `btn-close`     | Bootstrap’s close (×) icon button.                                                         |
        | `btn`           | Generic button class. Combine with color classes like `btn-primary`, `btn-secondary`, etc. |


        ⚙️ Important Modal Attributes:

        | Attribute                             | Description                                           |
        | ------------------------------------- | ----------------------------------------------------- |
        | `data-bs-toggle="modal"`              | Triggers modal when clicked.                          |
        | `data-bs-target="#myModal"`           | Specifies which modal to open. Must match modal `id`. |
        | `id="myModal"`                        | Unique ID for the modal element.                      |
        | `tabindex="-1"`                       | Prevents modal from being focusable before it opens.  |
        | `aria-labelledby="exampleModalLabel"` | Links title for accessibility.                        |
        | `aria-hidden="true"`                  | Keeps modal hidden until triggered.                   |
        | `data-bs-dismiss="modal"`             | Used on buttons to close the modal when clicked.      |

        
        🎚️ Modal Sizes:
        Use size classes with .modal-dialog to control modal width:

        | Class              | Description       |
        | ------------------ | ----------------- |
        | `modal-sm`         | Small modal       |
        | `modal-lg`         | Large modal       |
        | `modal-xl`         | Extra large modal |
        | `modal-fullscreen` | Fullscreen modal  |

        <div class="modal-dialog modal-lg">...</div>


        🧭 Modal Positions:
        Use these to center or change alignment:

        | Class                     | Description                                    |
        | ------------------------- | ---------------------------------------------- |
        | `modal-dialog-centered`   | Vertically centers modal in viewport           |
        | `modal-dialog-scrollable` | Adds scroll to modal body if content overflows |

        <div class="modal-dialog modal-dialog-centered modal-lg">...</div>


        💡 Static Backdrop Modal:
        By default, clicking outside closes the modal.
        You can prevent that using:

        | Attribute                   | Description                                   |
        | --------------------------- | --------------------------------------------- |
        | `data-bs-backdrop="static"` | Disables closing modal when clicking outside. |
        | `data-bs-keyboard="false"`  | Prevents closing modal using ESC key.         |

        <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false">


        -->
</body>

</html>
