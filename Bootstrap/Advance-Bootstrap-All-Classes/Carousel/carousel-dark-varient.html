<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel-All-Classes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons (for icons demo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-3">
        <h1 class="text-center mb-3">🌞 4. Dark Variant</h1>

        <div id="carouselDark" class="carousel carousel-dark slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="/images/nature-image-2.jpg" class="d-block w-100">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Dark Variant</h5>
                        <p>Text and icons appear dark.</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="/images/nature-image-3.jpg" class="d-block w-100">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Dark Variant</h5>
                        <p>Text and icons appear dark.</p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselDark" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselDark" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <!-- 🌓 .carousel-dark → makes captions and controls dark to show up better on light images. -->
    </div>
</body>

</html>
