<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel With Captions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons (for icons demo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-3">
        <h1 class="text-center mb-3">🌈 2. Carousel with Captions With Interval</h1>

        <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="/images/nature-image-2.jpg" class="d-block w-100" alt="...">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>First Slide Label</h5>
                        <p>Some quick example text for the first slide.</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="/images/nature-image-3.jpg" class="d-block w-100" alt="...">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Second Slide Label</h5>
                        <p>Example description for slide two.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 🧩 Classes used here:
         
            | Class                | Purpose                                                  |
            | -------------------- | -------------------------------------------------------- |
            | `.carousel-caption`  | Adds text overlay on the slide.                          |
            | `.d-none d-md-block` | Hides captions on small devices, shows on medium and up. |

        -->
    </div>
</body>

</html>
