<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Accordion All Classes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons (for icons demo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>
    <div class="container mt-3">
        <h1 class="text-center mb-3">Basic Accordion Example!!</h1>

        <div class="accordion" id="accordionExample">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                        Accordion Item #1
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                        Content for the first accordion item-1.
                    </div>
                    <div class="accordion-body">
                        Content for the first accordion item-2.
                    </div>
                    <div class="accordion-body">
                        Content for the first accordion item-3.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 
    
        🔍 Step-by-Step Explanation:

            1️⃣ <div class="accordion" id="accordionExample">

            Purpose: This is the main container for all accordion items.

            class="accordion" → activates Bootstrap’s accordion styling.

            id="accordionExample" → gives this accordion a unique ID.

            It is used later by data-bs-parent="#accordionExample" to connect items together.

            2️⃣ <div class="accordion-item">

            Represents one single accordion section (one header + one collapsible body).

            You can add multiple <div class="accordion-item"> blocks inside one accordion.

            3️⃣ <h2 class="accordion-header">

            This defines the header/title area of the accordion item.

            Inside it, you place the toggle button which controls opening/closing.

            4️⃣ <button class="accordion-button" type="button" ...>

            This is the clickable element that opens or collapses the section.

            Important attributes:

            | Attribute                       | Description                                                                                   |
            | ------------------------------- | --------------------------------------------------------------------------------------------- |
            | `class="accordion-button"`      | Applies Bootstrap’s accordion button styles.                                                  |
            | `type="button"`                 | Ensures the element acts as a button, not a form submit.                                      |
            | `data-bs-toggle="collapse"`     | Tells Bootstrap JS to use the **Collapse component** when this button is clicked.             |
            | `data-bs-target="#collapseOne"` | Links the button to the content div (`id="collapseOne"`) that will expand/collapse.           |
            | `aria-expanded="true"`          | Accessibility attribute — indicates whether the section is open (`true`) or closed (`false`). |
            | `aria-controls="collapseOne"`   | Tells screen readers that this button controls the element with `id="collapseOne"`.           |

            Text inside button:
            Accordion Item #1 → the visible label of the accordion header.
    
            5️⃣ <div id="collapseOne" class="accordion-collapse collapse show" ...>

            This div contains the collapsible content section.

            Attributes:

            | Attribute                                  | Description                                                              |
            | ------------------------------------------ | ------------------------------------------------------------------------ |
            | `id="collapseOne"`                         | The unique ID that matches the button’s `data-bs-target="#collapseOne"`. |
            | `class="accordion-collapse collapse show"` |                                                                          |


            accordion-collapse → part of accordion structure.
            collapse → makes it collapsible.
            show → keeps it open by default. Remove this class if you want it closed initially. |
            | data-bs-parent="#accordionExample" | Ensures only one accordion item opens at a time inside this parent accordion. When another opens, this one closes automatically. |

            6️⃣ <div class="accordion-body">

            This holds the actual content displayed when the item is open.

            You can put text, HTML, or any Bootstrap components here (lists, cards, forms, etc.).

            Example Content:
            Content for the first accordion item.

    -->

</body>

</html>
