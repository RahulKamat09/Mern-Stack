<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Accordion All Classes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons (for icons demo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>
    <div class="container mt-3">
        <h1 class="text-center mb-3">Accordion With Custom Colors example!!</h1>

        <div class="accordion" id="colorAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-success text-white" data-bs-toggle="collapse"
                        data-bs-target="#colorOne">
                        Blue Header
                    </button>
                </h2>
                <div id="colorOne" class="accordion-collapse collapse show">
                    <div class="accordion-body bg-light">Colored accordion example.</div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-primary text-white" data-bs-toggle="collapse"
                        data-bs-target="#colorOne">
                        Blue Header
                    </button>
                </h2>
                <div id="colorOne" class="accordion-collapse collapse show">
                    <div class="accordion-body bg-light">Colored accordion example.</div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-danger text-white" data-bs-toggle="collapse"
                        data-bs-target="#colorOne">
                        Blue Header
                    </button>
                </h2>
                <div id="colorOne" class="accordion-collapse collapse show">
                    <div class="accordion-body bg-light">Colored accordion example.</div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button bg-warning text-white" data-bs-toggle="collapse"
                        data-bs-target="#colorOne">
                        Blue Header
                    </button>
                </h2>
                <div id="colorOne" class="accordion-collapse collapse show">
                    <div class="accordion-body bg-light">Colored accordion example.</div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
