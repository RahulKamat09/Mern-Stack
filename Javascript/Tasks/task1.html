<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks-Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #38a3f1, #58d68d);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #ddd;
            animation: slideUp 1s ease-in-out;
        }

        h2 {
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            text-align: left;
            font-weight: bold;
            color: #444;
        }

        input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #38a3f1;
            box-shadow: 0 0 8px #38a3f17a;
        }

        button {
            padding: 12px 25px;
            background: #38a3f1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #2f89cc;
        }

        @media(max-width: 500px) {
            .card {
                margin: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>📚 Marks Calculator</h2>
        <form>
            <div class="input-group">
                <label for="english">English:</label>
                <input type="number" id="english" placeholder="Enter your English marks" min="0" max="100">

                <label for="maths">Maths:</label>
                <input type="number" id="maths" placeholder="Enter your Maths marks" min="0" max="100">

                <label for="hindi">Hindi:</label>
                <input type="number" id="hindi" placeholder="Enter your Hindi marks" min="0" max="100">
            </div>
            <button type="submit" onclick="return result()">Calculate</button>
        </form>
        <h2 id="answer1"></h2>
        <h2 id="answer2"></h2>
        <h2 id="answer3"></h2>
    </div>

    <script>

        function result() {

            var english = document.getElementById('english').value;
            var maths = document.getElementById('maths').value;
            var hindi = document.getElementById('hindi').value;

            var total = +english + +maths + +hindi;

            document.getElementById('answer1').innerHTML = "Total Is: " + total;

            var per = (total * 100) / 300;
            document.getElementById('answer2').innerHTML = "Percentage is :" + per + "%";

            if (per >= 90) {
                document.getElementById('answer3').innerHTML = "Grade is : O";
            }
            else if (per >= 80) {
                document.getElementById('answer3').innerHTML = "Grade is : A++";
            }
            else if (per >= 70) {
                document.getElementById('answer3').innerHTML = "Grade is : A";
            }
            else if (per >= 60) {
                document.getElementById('answer3').innerHTML = "Grade is : B";
            }
            else if (per >= 50) {
                document.getElementById('answer3').innerHTML = "Grade is : C";
            }
            else if (per >= 40) {
                document.getElementById('answer3').innerHTML = "Grade is : Pass";
            }
            else {
                document.getElementById('answer3').innerHTML = "Grade is : Fail";
            }
            return false;

        }

    </script>

</body>

</html>
