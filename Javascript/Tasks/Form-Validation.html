<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Form-Validation</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			box-sizing: border-box;
		}

		body {
			background: linear-gradient(135deg, #56ccf2, #2f80ed);
			padding: 40px 0;
		}

		.container {
			max-width: 700px;
			background: #fff;
			margin: auto;
			padding: 30px;
			border-radius: 12px;
			box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.15);
			animation: fadeIn 0.5s ease-in-out;
		}

		h1 {
			text-align: center;
			margin-bottom: 25px;
			font-size: 2rem;
			color: #fff;
			padding: 15px;
			background: linear-gradient(135deg, #2f80ed, #56ccf2);
			border-radius: 8px;
			box-shadow: 0px 4px 10px rgba(47, 128, 237, 0.3);
		}

		.form-group {
			display: flex;
			gap: 15px;
			align-items: center;
			margin-bottom: 20px;
			flex-wrap: wrap;
		}

		.form-group label {
			width: 150px;
			font-weight: bold;
			font-size: 1rem;
			color: #333;
		}

		.form-group input[type="text"],
		.form-group input[type="password"],
		.form-group input[type="file"],
		.form-group textarea,
		.form-group select {
			flex: 1;
			padding: 10px 15px;
			border: 2px solid #ccc;
			border-radius: 6px;
			outline: none;
			font-size: 0.95rem;
			transition: 0.3s ease;
			background: #fafafa;
		}

		.form-group input:focus,
		.form-group textarea:focus,
		.form-group select:focus {
			border-color: #2f80ed;
			box-shadow: 0 0 8px rgba(47, 128, 237, 0.4);
			transform: scale(1.02);
		}

		input[type="radio"],
		input[type="checkbox"] {
			margin-right: 6px;
			cursor: pointer;
		}

		/* Attractive Submit Button */
		.form-group button {
			padding: 15px 100px;
			font-size: 1rem;
			border: none;
			background: linear-gradient(135deg, #2f80ed, #56ccf2);
			color: white;
			font-weight: bold;
			border-radius: 6px;
			cursor: pointer;
			transition: 0.3s ease;
			box-shadow: 0px 4px 10px rgba(47, 128, 237, 0.3);
			margin: 0 auto;
			/* Centers the button */
		}

		.form-group button:hover {
			background-color: #2b82c9;
			transform: scale(1.05);
		}

		.form-group button:active {
			background-color: #1f5f91;
			transform: scale(0.98);
		}


		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(-10px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>Register Form</h1>
		<form action="">
			<div class="form-group">
				<label for="Username">Username<span style="color: red;">*</span></label>
				<input type="text" name="Username" placeholder="Enter Your Username!!">
			</div>
			<div class="form-group">
				<label for="Password">Password<span style="color: red;">*</span></label>
				<input type="password" name="password" placeholder="Enter Your Password!!">
			</div>
			<div class="form-group">
				<label for="E-mail">E-mail<span style="color: red;">*</span></label>
				<input type="text" name="E-mail" placeholder="Enter Your Email!!">
			</div>
			<div class="form-group">
				<label for="Username">Gender<span style="color: red;">*</span></label>
				<input type="radio" name="Gender">Male
				<input type="radio" name="Gender">Female
			</div>
			<div class="form-group">
				<label for="Hobby">Hobby<span style="color: red;">*</span></label>
				<input type="checkbox" name="cricket">Cricket
				<input type="checkbox" name="Singing">Singing
				<input type="checkbox" name="Dancing">Dancing
				<input type="checkbox" name="Reading">Reading
			</div>
			<div class="form-group">
				<label for="Country">Country<span style="color: red;">*</span></label>
				<select name="Country" id="">
					<option value="" hidden>Select Country</option>
					<option value="India">India</option>
					<option value="Russia">Russia</option>
					<option value="Canada">Canada</option>
					<option value="USA">USA</option>
					<option value="Australia">Australia</option>
					<option value="Japan">Japan</option>
				</select>
			</div>
			<div class="form-group">
				<label for="Address">Address<span style="color: red;">*</span></label>
				<textarea name="address" placeholder="Enter Your Address!!!"></textarea>
			</div>
			<div class="form-group">
				<label for="Profile Photo">Profile Photo:<span style="color: red;">*</span></label>
				<input type="file" name="img">
			</div>
			<div class="form-group">
				<label for="Resume">Resume<span style="color: red;">*</span></label>
				<input type="file" name="resume">
			</div>
			<div class="form-group">
				<button type="submit">Submit</button>
			</div>

		</form>
	</div>
</body>

</html>
