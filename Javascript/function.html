<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript || Function</title>
</head>

<body>
    <!--Functions in JavaScript
        A function in JavaScript is a block of reusable code that performs a specific task. 
        Functions make your code modular, reusable, and organized. -->
    <script>

        //Function In Javascript:
        //Types Of Function:
        /*   1. Inbuilt (Built-in) Functions
            These are predefined functions provided by JavaScript. You don’t have to define them — just use them directly.*/

        var name = "Rahul Kamat";
        document.write(name.toUpperCase());

        /*  2. User-Defined Functions
            Functions that you create yourself to perform custom tasks.*/
        
        function Multiply1(){
            var a = 12;
            var b = 13;
            var mul = a*b;
            document.write(mul +"<br>");
        }

        Multiply1();

        /*  Function with Parameters (Arguments) in JavaScript
            A function with parameters (also called arguments) allows you to pass data into a function so 
            that it can perform a task using different input values.
            Syntex:

            function functionName(parameter1, parameter2, ...) {
            // code using parameters
            }

            functionName(argument1, argument2, ...);
            */

            function Sums(i,j){
                return i+j;
            }
            var result = Sums(12,14);
            document.write(result)
    </script>
</body>

</html>
