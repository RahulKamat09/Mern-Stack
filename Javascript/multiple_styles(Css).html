<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple-Styles</title>
</head>

<body>
    <div align="center">
        <h1 id="test">THis is a javscript Text</h1>
        <input type="submit" value="Click Here" onclick="multiple_style()">
        <input type="submit" value="Remove" onclick="Remove()">
    </div>

    <script>
        function multiple_style() {
            document.getElementById('test').setAttribute('style', 'background-color:red;color:yellow',);
        }

        function Remove(){
            document.getElementById('test').setAttribute('style','background-color:;color:');
        }

        // function Remove() {
        //     document.getElementById('test').remove();
        // } 
        // REMOVE THE ENTIRE H1 Element!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

    </script>
</body>

</html>
