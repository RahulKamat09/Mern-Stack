<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript-Syntax</title>
</head>

<body>
    <h1>Javascript-Syntax</h1>

    <script>

        // single line comment

        /*
        multi line comment
        */

        document.write("This Is A Javascript Text");

        document.writeln('this is also another way to write Javascript Text')

    </script>

    <!-- Html Manipulation -->
     <h1 id="text">this is html Text</h1>
     <script>
        document.getElementById('text').innerHTML="This is a Javascript Text";
     </script>

     <!-- Css Manipulation -->
      <h1 id="demo" style="background-color: yellow; color: aqua;">I am Green</h1>

      <script>
        document.getElementById('demo').style.backgroundColor="green";
        document.getElementById('demo').style.color="white";
      </script>
</body>

</html>
