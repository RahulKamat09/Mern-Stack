<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String-Creation</title>
</head>

<body>
    <!-- 🧠 What is a String in JavaScript?

    A string is a sequence of characters used to represent text.
    Strings in JavaScript are immutable, meaning once created, their values cannot be changed (though you can create new
    strings from them). -->

    <script>

        //Using Literal:
        let name = "Rahul Kamat";
        let str1 = "Hello";       // Double quotes
        let str2 = 'World';       // Single quotes
        let str3 = `Hi ${str1}`;  // Template literal

        // Using Object:(New Keyword)
        let str = new String("Hello");
        document.writeln(str); 
    </script>


</body>

</html>
