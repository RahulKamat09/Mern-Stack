<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array-Methods</title>
</head>

<body>
    <!-- 🧠 1. What is an Array in JavaScript?

    ✅ Definition:
    An Array is a data structure used to store multiple values in a single variable.
    It can hold numbers, strings, objects, or even other arrays. -->

    <!-- let fruits = ["Apple", "Banana", "Mango"];
    console.log(fruits); // ["Apple", "Banana", "Mango"] -->

    <script>
        // ⚙️ 2. Creating Arrays:
        let arr1 = [10, 20, 30];               // Using array literal ✅ (most common)
        let arr2 = new Array("Red", "Green");  // Using Array constructor


        // 🧮 3. Accessing Array Elements:
        let fruits = ["Apple", "Banana", "Mango"];
        console.log(fruits[0]);  // "Apple"
        console.log(fruits[2]);  // "Mango"


        // 🔁 4. Changing Array Elements:
        fruits[1] = "Orange";
        console.log(fruits); // ["Apple", "Orange", "Mango"]

        // 🧰 5. Common Properties:
        // | Property     | Description                          | Example               |
        // | ------------ | ------------------------------------ | --------------------- |
        // | **`length`** | Returns the total number of elements | `fruits.length` → `3` |

    </script>

</body>

</html>
