<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallBack-With-Parameter in JavaScript</title>
</head>

<body>
    <h1>Check Console!!!</h1>
    <h3>Press fn + <code>F12</code></h3>
    <script>
        function calculate(a, b, callback) {
            let result = a + b;
            callback(result);
        }
        function displayMessage(sum) {
            console.log("The Sum is:", sum);
        }
        calculate(5, 10, displayMessage);

        // 📘 Explanation:
        // The result of calculation is passed to the callback function as an argument.
    </script>
</body>

</html>
