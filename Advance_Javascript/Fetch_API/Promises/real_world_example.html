<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-world-exmple of Async Await/title>
</head>

<body>
    <script>
        function loginUser(username, password) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log("✅ User logged in:", username);
                    resolve({ username: username });
                }, 1000);
            });
        }

        function getUserDetails(user) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log("📦 Fetching user details...");
                    resolve({ ...user, email: "user@example.com", age: 20 });
                }, 1000);
            });
        }

        function showDashboard(user) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log(`🎉 Welcome ${user.username}! Your email: ${user.email}`);
                    resolve();
                }, 1000);
            });
        }

        // ✅ Async/Await Implementation
        async function runApp() {
            try {
                const user = await loginUser("Rahul", "12345");
                const userDetails = await getUserDetails(user);
                await showDashboard(userDetails);
                console.log("🏁 Process complete!");
            } catch (error) {
                console.log("❌ Error:", error);
            }
        }

        runApp();

    </script>
</body>

</html>
