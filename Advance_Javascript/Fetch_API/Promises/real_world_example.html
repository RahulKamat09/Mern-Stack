<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-world-exmple of Async Await</title>
</head>

<body>
    <script>

        function loginUser(username, password) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log("User logged in:", username);
                    resolve({ username: username });
                }, 1000);
            });
        }

        function getUserDetails(user) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log("Fetching User Details....");
                    resolve({ ...user, email: "Rahulkamat@gmail.com", age: 20 });
                }, 1000);
            });
        }

        function showUserDetails(user) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log(`Welcome ${user.username}! Your Email:${user.email}`);
                    resolve();
                }, 1000);
            });
        }

        async function runApp() {
            try {
                const user = await loginUser("Rahul Kamat", "300919");
                const UserDetail = await getUserDetails(user);
                await showUserDetails(UserDetail);
                console.log("User Logged In SuccessFully!");
            }
            catch(error){
                console.log("Error",error);
            }
            finally{
                console.log("Process Has been completed Sucessfully!!");
            }
        }

        runApp();

    </script>
</body>

</html>
