<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error-Handling in Async Await</title>
</head>

<body>
    <script>async function fetchData() {
            try {
                let response = await fetch("https://wrong-url-example.com");
                let data = await response.json();
                console.log(data);
            } catch (error) {
                console.log("❌ Something went wrong:", error);
            }
        }
        fetchData();
    </script>
    <!-- 🧠 Note: -->
    <!-- If the URL is invalid or the network fails, control jumps directly to the catch block. -->
</body>

</html>
