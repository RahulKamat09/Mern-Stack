<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADV-JS API-4</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap icon CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        .spinner-container {
            display: none;
            justify-content: center;
            align-items: center;
            height: 150px;
        }

        .card-img-top {
            height: 200px;
            object-fit: contain;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-description {
            font-size: 0.9rem;
            color: #555;
            margin: 5px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            /* NEW standard property (supported in modern browsers) */
            line-clamp: 3;
        }

        .search-bar {
            position: relative;
        }

        .search-icon {
            position: absolute;
            right: 290px;
            top: 7px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2 class="text-center text-primary my-5">Products Here!!</h2>

        <div class="mb-4 text-center search-bar">
            <input type="text" id="searchInput" class="form-control w-50 d-inline" placeholder="Search products..."
                onkeyup="searchProducts()">
            <button onclick="fetch_data()" class="btn btn-info mx-auto">Fetch Data</button>
        </div>

        <!-- Buttons to filter -->
        <div class="text-center mb-4">
            <button class="btn btn-outline-primary m-1" onclick="filterProducts('all')">All</button>
            <button class="btn btn-outline-primary m-1" onclick="filterProducts(`men's clothing`)">Men</button>
            <button class="btn btn-outline-primary m-1" onclick="filterProducts(`women's clothing`)">Women</button>
            <button class="btn btn-outline-primary m-1" onclick="filterProducts('jewelery')">Jewelery</button>
            <button class="btn btn-outline-primary m-1" onclick="filterProducts('electronics')">Electronics</button>
        </div>

        <!-- Loading Spinner -->
        <div class="spinner-container" id="spinner">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="row" id="product-data">
            <!-- Data Will Show here thorough Api! -->
        </div>

        <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="cartModalLabel">Cart Update</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="cartModalBody">
                        <!-- Product info will go here -->
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        var product_data = document.getElementById('product-data');
        const spinner = document.getElementById('spinner');
        let isDataFetched = false;
        let allProducts = []; // global array to store products

        function display_data(ObjArr) {
            product_data.innerHTML = "";
            for (let product of ObjArr) {
                var html = `
                <div class="col-md-3 mb-4">
                    <div class="card h-100">
                        <img src="${product.image}" class="card-img-top" alt="${product.title}">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <h5 class="card-title">${product.title}</h5>
                            <p class="card-description">${product.description}</p>
                            <p class="text-muted"><strong>Category:</strong> ${product.category}</p>
                            <h5 class="text-success">$${product.price}</h5>
                            <p class="text-warning mb-2"><strong>Rating:</strong> ${product.rating.rate} ⭐ (${product.rating.count} reviews)</p>
                            <button class="btn btn-primary mt-auto" onclick="addToCart('${product.title}')">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `;
                product_data.insertAdjacentHTML('beforeend', html);
            }
        }

        function addToCart(productTitle) {
            document.getElementById("cartModalBody").innerText =
                `"${productTitle}" added to your cart successfully!`;
            var cartModal = new bootstrap.Modal(document.getElementById('cartModal'));
            cartModal.show();
        }

        function fetch_data() {
            if (isDataFetched) return;

            spinner.style.display = "flex"; // show spinner

            fetch(`https://fakestoreapi.com/products`)
                .then(response => response.json())
                .then(obj => {
                    allProducts = obj; // store globally
                    display_data(allProducts);
                    spinner.style.display = "none";
                    isDataFetched = true;
                })
                .catch(err => {
                    console.log(err);
                    spinner.innerHTML = "<p class='text-danger'>Failed to load products.</p>";
                });
        }

        // ✅ Global filter function
        function filterProducts(category) {
            if (category === "all") {
                display_data(allProducts);
            } else {
                let filtered = allProducts.filter(p => p.category === category);
                display_data(filtered);
            }
        }

        // ✅ Search function
        function searchProducts() {
            let searchValue = document.getElementById("searchInput").value.toLowerCase();
            let filtered = allProducts.filter(p =>
                p.title.toLowerCase().includes(searchValue) ||
                p.category.toLowerCase().includes(searchValue)
            );
            display_data(filtered);
        }
    </script>



</body>

</html>
