<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADV-JS API-2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="table-responsive container">
        <table class="table table-info table-bordered" id="table_data">
            <tr>
                <th>Id</th>
                <th>User-Id</th>
                <th>Title</th>
                <th>Body</th>
            </tr>
        </table>
    </div>

    <script>
        fetch(`https://jsonplaceholder.typicode.com/posts`)
        .then(response => response.json())
        .then(obj =>{
            console.log(obj);
            display_date(obj);
        })

        var data_table = document.getElementById("table_data");
        function display_date(objArr){
            for(value of objArr){
                var html =
                `<tr>
                    <td>${value.id}</td>
                    <td>${value.userId}</td>
                    <td>${value.title}</td>
                    <td>${value.body}</td>
                </tr>`;
                data_table.insertAdjacentHTML('beforeend',html);
            }
        }
    </script>

</body>

</html>
