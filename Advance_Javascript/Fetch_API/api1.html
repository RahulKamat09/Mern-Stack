<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADV-JS API-1</title>
</head>

<body>
    <h1>Check Console!!!</h1>
    <script>
        //📌 1. Definition of fetch()

        //fetch() is a built -in JavaScript function used to make HTTP requests(GET, POST, PUT, DELETE etc.) to APIs or servers.

        //It returns a Promise, which means it runs asynchronously and lets you handle success or failure with .then() and.catch().

        //👉 Syntax:

        /*fetch(url, options)
            .then(response => { ... })   // success response
            .catch(error => { ... });    // error handling*/

        fetch('https://jsonplaceholder.typicode.com/posts')
            .then(response => response.json())  // convert response to JSON
            .then(obj => console.log(obj))      // log the JSON object
            .catch(error => console.log(error)) // handle error if API fails

        // 🔹 Step - by - Step:

        // fetch('https://jsonplaceholder.typicode.com/posts')
        // → Calls the API(a fake testing API).

        // .then(response => response.json())
        // → Converts the raw HTTP response into JSON format.

        // .then(obj => console.log(obj))
        // → Logs the actual JavaScript object / array.

        // .catch(error => console.log(error))
        // → Runs if there is a network error or wrong URL

        //Different Types of API Responses:

        //🔹 (A) All posts(Array of objects):

        fetch("https://jsonplaceholder.typicode.com/posts")
            .then(res => res.json())
            .then(data => console.log(data));


        //🔹 (B) Single post by ID:

        fetch("https://jsonplaceholder.typicode.com/posts/2")
            .then(res => res.json())
            .then(data => console.log(data));


        //🔹 (C) Filter data using query parameter(Category Wise):
        fetch("https://jsonplaceholder.typicode.com/posts?userId=1")
            .then(res => res.json())
            .then(data => console.log(data));
    </script>
</body>

</html>
