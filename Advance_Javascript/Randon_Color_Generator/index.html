<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            transition: background-color 0.6s ease;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        button {
            font-size: 18px;
            padding: 12px 30px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        #start:hover {
            background-color: #0d6efd;
            color: white;
            transform: scale(1.1);
        }

        #stop:hover {
            background-color: #dc3545;
            color: white;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="container text-center">
        <h1 class="bg-dark text-light p-3 rounded-3 shadow">🎨 Random Background Color Changer 🎨</h1>
        <div class="d-flex gap-4">
            <button id="start" class="btn btn-success shadow">Start</button>
            <button id="stop" class="btn btn-danger shadow">Stop</button>
        </div>
    </div>

    <script>
        const randomColor = function () {
            const hex = "0123456789ABCDEF";
            let color = "#";
            for (let i = 0; i < 6; i++) {
                color += hex[Math.floor(Math.random() * 16)];
            }
            return color;
        };

        let intervalId;

        const startChangingColor = function () {
            if (!intervalId) {
                intervalId = setInterval(() => {
                    document.body.style.backgroundColor = randomColor();
                }, 1000);
            }
        };

        const stopChangingColor = function () {
            // Change color immediately when stopped
            document.body.style.backgroundColor = randomColor();

            clearInterval(intervalId);
            intervalId = null;
        };

        document.querySelector("#start").addEventListener("click", startChangingColor);
        document.querySelector("#stop").addEventListener("click", stopChangingColor);
    </script>
</body>

</html>
