<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADV-JS ALERT-BOX</title>
</head>

<body>
    <!-- 📌 Dialog Box in JavaScript

        A dialog box is a special type of popup window that appears in the browser to interact with the user.
        They are synchronous (blocking) – meaning the browser stops and waits for the user to take action before continuing the code execution.

        JavaScript provides three main types of dialog boxes:

        1. Alert Box → alert()

        2. Confirm Box → confirm()

        3. Prompt Box → prompt()        
        
        
        
        1). Alert Box (alert())

        Purpose: Display a message to the user.

        It shows an OK button only.

        The user must click OK to continue.

        Return value: Nothing (always undefined).

        👉 Syntax:

        alert("This is an alert message!");

        
        -->

    <button onclick="showAlert()">Click Me</button>

    <script>
        function showAlert() {
            alert("Hello! This is an alert box.");
        }
    </script>
</body>

</html>
