<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reservation - BookNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="form-container animate-fadeIn">
            <h2 class="text-center mb-4 text-primary fw-bold">📚 Book Reservation Form</h2>
            <form id="reservationForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter full name">
                        <small class="error" id="nameError"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter email">
                        <small class="error" id="emailError"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone" placeholder="10-digit phone number">
                        <small class="error" id="phoneError"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Book Title</label>
                        <input type="text" class="form-control" id="bookTitle" placeholder="Book Title">
                        <small class="error" id="titleError"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Author Name</label>
                        <input type="text" class="form-control" id="author" placeholder="Author Name">
                        <small class="error" id="authorError"></small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Pickup Date</label>
                        <input type="date" class="form-control" id="pickupDate">
                        <small class="error" id="dateError"></small>
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <button type="reset" class="btn btn-outline-secondary btn-animated">Reset</button>
                    <button type="submit" class="btn btn-primary btn-animated">Reserve</button>
                </div>
            </form>
            <div id="message" class="mt-3"></div>

        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
