<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Reservations - BookNest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light-custom">
  <div class="container my-5">
    <div class="form-container animate-fadeIn shadow-lg p-4 rounded glass-card">
      <h2 class="text-center mb-4 text-primary fw-bold">📖 Reservation List</h2>

      <!-- Search Bar -->
      <div class="mb-4">
        <input type="text" id="searchBox" class="form-control search-bar" placeholder="🔍 Search reservations...">
      </div>

      <!-- Table -->
      <table class="table table-hover table-striped align-middle text-center shadow-sm rounded" id="reservationTable">
        <thead class="table-primary">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Book Title</th>
            <th>Author</th>
            <th>Pickup Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="reservationList">
          <!-- Example row -->
          <tr class="animate-row">
            <td>1</td>
            <td>John Doe</td>
            <td>johndoe@gmail.com</td>
            <td>+91 9876543210</td>
            <td>The Alchemist</td>
            <td>Paulo Coelho</td>
            <td>2025-09-10</td>
            <td>
              <button class="btn btn-sm btn-outline-success me-2 action-btn"><i class="bi bi-pencil-square"></i></button>
              <button class="btn btn-sm btn-outline-danger action-btn"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Message -->
      <div id="message" class="mt-3 text-center fw-semibold text-muted empty-message">No reservations found.</div>

      <!-- Button -->
      <div class="text-end mt-4">
        <a href="index.html" class="btn btn-primary btn-animated">
          ➕ New Reservation
        </a>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
