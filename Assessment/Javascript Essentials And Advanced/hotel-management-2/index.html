<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guest Registration - Hotel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f0f4f9;
        }

        .navbar {
            background: linear-gradient(90deg, #0d6efd, #0dcaf0);
        }

        .card {
            border-radius: 15px;
        }

        .fade-in {
            animation: fadeIn .6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-primary {
            background: #0d6efd;
            border: none;
        }

        .btn-primary:hover {
            background: #0b5ed7;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">🏨 Guest Registration</span>
            <a href="view.html" class="btn btn-light btn-sm">View Guests</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card shadow-lg p-4 fade-in">
            <h3 class="mb-3 text-primary">Register a Guest</h3>
            <form id="guestForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <input class="form-control" id="fullName" placeholder="Full Name *" required>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" id="phone" placeholder="Phone (10 digits) *" required>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" id="email" type="email" placeholder="Email *" required>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" id="aadhar" placeholder="Aadhar (12 digits) *" required>
                    </div>
                    <div class="col-12">
                        <textarea class="form-control" id="address" placeholder="Address *" rows="2"
                            required></textarea>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" id="checkin" type="date" required>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" id="checkout" type="date" required>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" id="adults" type="number" min="1" placeholder="No. of Adults *"
                            required>
                    </div>
                    <div class="col-md-6">
                        <textarea class="form-control" id="purpose" placeholder="Purpose of Visit *" rows="2"
                            required></textarea>
                    </div>
                </div>
                <div class="mt-4 text-center">
                    <button class="btn btn-primary px-4">Save Guest</button>
                    <button type="button" id="clearBtn" class="btn btn-outline-secondary px-4 ms-2">Clear</button>
                </div>
            </form>
            <div id="msgBox" class="mt-3"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
